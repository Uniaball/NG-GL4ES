name: Build NG-GL4ES for Android

on:
  push:
  workflow_dispatch:

env:
  LTO_LEVEL: 2              # 0=no LTO, 1=ThinLTO, 2=Full LTO
  USE_EXTRA_OPTIMIZATIONS: ON

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # NOTE(test-revert-glslang-bump): intentionally DO NOT run
    #   git submodule update --remote --recursive
    # here. That step ignores the pinned submodule commits and pulls glslang /
    # SPIRV-Cross to their latest remote main, which would undo this branch's
    # revert of 4108e6c and defeat the whole A/B test. We want the OLD glslang
    # that bzlzhh (6e153a1) used, i.e. exactly the commits recorded in the tree.

    - name: Configure CMake
      run: |
        LTO_LEVEL=${{ env.LTO_LEVEL }}
        LTO_FLAG=""
        if [ "$LTO_LEVEL" -eq 2 ]; then
          LTO_FLAG="-flto"
        elif [ "$LTO_LEVEL" -eq 1 ]; then
          LTO_FLAG="-flto=thin"
        fi
        CMAKE_ARGS=(
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_TOOLCHAIN=clang
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_EXTRA_OPTIMIZATIONS=${{ env.USE_EXTRA_OPTIMIZATIONS }}
          -DLTO_FLAG="$LTO_FLAG"
        )
        cmake -B build "${CMAKE_ARGS[@]}"

    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)

    - name: Strip
      run: |
        cd build
        $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all libng_gl4es.so

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: NG-GL4ES
        path: build/libng_gl4es.so
